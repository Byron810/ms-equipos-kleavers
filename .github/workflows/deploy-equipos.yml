name: CI/CD Pipeline - Microservicio Equipos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar paquetes NuGet
        run: dotnet restore ms-equipos-dotnet/Kleavers.Equipos.API/Kleavers.Equipos.API.csproj

      - name: Compilar proyecto
        run: dotnet build ms-equipos-dotnet/Kleavers.Equipos.API/Kleavers.Equipos.API.csproj --configuration Release --no-restore

      - name: Publicar binarios (.NET Publish)
        run: |
          dotnet publish ms-equipos-dotnet/Kleavers.Equipos.API/Kleavers.Equipos.API.csproj \
            -c Release \
            -r linux-x64 \
            --no-self-contained \
            -o ./publish

      - name: Crear paquete ZIP
        run: |
          cd ./publish
          zip -r ../publish.zip .
          cd ..

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kleavers-equipos-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish.zip'
